<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>旅途热榜 - 小红书抖音实时搜索</title>
<meta name="description" content="实时搜索小红书排名，支持所有城市和地点">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --red:#FF2442;--red-light:#FFF0F2;--black:#1A1A1A;--text:#333;--text-light:#999;
  --bg:#F5F5F5;--white:#fff;--border:#EBEBEB;--orange:#FF8800;--blue:#4A9EF5;
  --green:#07C160;--purple:#8B5CF6;--cyan:#06B6D4;
  --safe-b:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{display:none}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
.header{background:var(--white);padding:12px 16px 8px;flex-shrink:0;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.app-title{font-size:18px;font-weight:700;color:var(--black)}
.app-title span{color:var(--red)}
.header-actions{display:flex;gap:6px}
.header-btn{width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.search-wrap{display:flex;gap:8px;align-items:center}
.search-box{flex:1;display:flex;align-items:center;background:var(--bg);border-radius:20px;padding:0 12px;height:36px}
.search-box svg{width:16px;height:16px;color:var(--text-light);flex-shrink:0}
.search-box input{border:none;outline:none;background:transparent;padding:0 8px;font-size:14px;width:100%;color:var(--text)}
.search-btn{height:36px;padding:0 16px;border:none;background:var(--red);color:#fff;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.search-btn:active{opacity:.85}
.search-btn:disabled{opacity:.5;cursor:not-allowed}
.search-hints{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hot-tag{padding:3px 10px;border-radius:12px;font-size:11px;background:var(--white);border:1px solid var(--border);cursor:pointer;color:var(--text);font-weight:500}
.hot-tag:active{opacity:.7}
.hot-tag svg{width:12px;height:12px;vertical-align:middle;margin-right:2px}
.page-container{flex:1;overflow:hidden;position:relative}
.page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 80px;display:none}
.page.active{display:block}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:56px;padding-bottom:var(--safe-b);background:var(--white);border-top:1px solid var(--border);display:flex;z-index:30}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text-light);font-size:10px;transition:color .15s}
.tab-item.active{color:var(--red)}
.tab-item svg{width:22px;height:22px}
.tab-label{font-weight:500}

/* 搜索结果 */
.result-city{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.result-city::before{content:'';width:4px;height:16px;background:var(--red);border-radius:2px}
.section-title{font-size:15px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.section-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}
.icon-food{background:#FFF0F2;color:var(--red)}
.icon-scenic{background:#E8F2FF;color:var(--blue)}
.icon-hotel{background:#FFF7ED;color:var(--orange)}
.icon-xhs{background:#FFF0F2;color:var(--red)}

/* 排名卡片 */
.rank-card{background:var(--white);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;position:relative;transition:transform .15s}
.rank-card:active{transform:scale(.98)}
.rank-num{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px}
.rank-num.top1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-num.top2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#fff}
.rank-num.top3{background:linear-gradient(135deg,#CD7F32,#B8860B);color:#fff}
.rank-num.normal{background:var(--bg);color:var(--text-light)}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:14px;font-weight:600;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rank-desc{font-size:12px;color:var(--text-light);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank-hot{font-size:10px;color:var(--red);font-weight:600;margin-top:3px}
.rank-source{font-size:10px;color:var(--blue);font-weight:500;margin-left:4px}
.rank-actions{display:flex;gap:4px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.app-btn{display:flex;align-items:center;gap:2px;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:600;border:none;cursor:pointer;white-space:nowrap}
.app-btn:active{opacity:.8}
.app-btn-xhs{background:var(--red);color:#fff}
.app-btn-dy{background:#1A1A1A;color:#fff}
.app-btn-add{background:var(--green);color:#fff}
.app-btn-added{background:#E8E8E8;color:#999;cursor:default;pointer-events:none}

/* 实时搜索结果卡片 */
.live-card{background:var(--white);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.live-card .live-badge{font-size:9px;background:linear-gradient(135deg,var(--red),#FF6B6B);color:#fff;padding:1px 6px;border-radius:4px;font-weight:600;margin-left:4px}
.live-author{font-size:11px;color:var(--text-light);margin-top:2px}
.live-likes{font-size:11px;color:var(--red);margin-top:2px;font-weight:600}

/* 加载状态 */
.loading-state{text-align:center;padding:40px 20px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-light)}

/* 搜索模式切换 */
.search-mode{display:flex;gap:6px;margin-top:8px}
.mode-btn{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--text)}
.mode-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .icon{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:13px}

/* 时间线 */
.timeline-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.timeline-header h2{font-size:18px;font-weight:700}
.add-manual-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--red);color:#fff;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.add-manual-btn:active{opacity:.85}
.add-manual-btn svg{width:14px;height:14px}
.date-group{margin-bottom:16px}
.date-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:8px;padding:0 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.date-label svg{width:14px;height:14px}
.date-label .toggle-icon{margin-left:auto;font-size:10px;transition:transform .2s}
.date-label .toggle-icon.collapsed{transform:rotate(-90deg)}
.date-group-body{overflow:hidden;transition:max-height .3s ease}
.date-group-body.collapsed{max-height:0 !important}
.tl-older-btn{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--white);border-radius:12px;font-size:13px;color:var(--text-light);cursor:pointer;border:1px dashed var(--border);margin-top:4px;width:100%}
.tl-older-btn:active{background:var(--bg)}
.tl-date-search{display:flex;gap:8px;margin-bottom:12px}
.tl-date-search input{flex:1;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;outline:none;background:var(--white)}
.tl-date-search input:focus{border-color:var(--red)}
.tl-date-search button{border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
.tl-date-search .search-go{background:var(--red);color:#fff}
.tl-date-search .search-go:active{opacity:.8}
.tl-date-search .search-clear{background:var(--bg);color:var(--text)}
.tl-date-search-btn{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;transition:all .15s}
.tl-date-search-btn:active{transform:scale(.95)}
.tl-date-search-btn svg{width:16px;height:16px;flex-shrink:0}
.tl-date-search-btn.active{border-color:var(--blue);background:#EFF6FF;color:var(--blue)}
.tl-date-search-btn .date-clear{margin-left:2px;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;font-weight:700}
.tl-date-input{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap;transition:all .15s;width:auto;flex:none;line-height:normal;height:auto}
.tl-date-input:active{transform:scale(.95)}
.tl-date-input::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer}
.tl-date-input::-webkit-datetime-edit{padding:0}
.tl-date-input::-webkit-date-and-time-value{}
.tl-date-input:invalid::-webkit-datetime-edit{color:var(--text-light)}
.tl-date-wrap{position:relative;display:inline-flex;align-items:center}
.tl-date-wrap .date-placeholder{position:absolute;left:12px;font-size:13px;color:var(--text-light);pointer-events:none;white-space:nowrap}
.tl-date-wrap .date-placeholder svg{width:14px;height:14px;vertical-align:middle;margin-right:4px}
.tl-search-result-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--red-light);color:var(--red);border-radius:14px;font-size:12px;font-weight:600;margin-bottom:8px}
.tl-search-result-tag button{background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;font-weight:700;padding:0 0 0 4px}
.tl-card{background:var(--white);border-radius:12px;padding:12px;margin-bottom:6px;position:relative;border-left:3px solid var(--blue)}
.tl-card.type-food{border-left-color:var(--red)}
.tl-card.type-scenic{border-left-color:var(--blue)}
.tl-card.type-hotel{border-left-color:var(--orange)}
.tl-card.done{opacity:.65}
.tl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-type{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.tl-type.type-food{background:var(--red-light);color:var(--red)}
.tl-type.type-scenic{background:#E8F2FF;color:var(--blue)}
.tl-type.type-hotel{background:#FFF7ED;color:var(--orange)}
.tl-status{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;cursor:pointer;border:none}
.tl-status.pending{background:#FFF7ED;color:var(--orange)}
.tl-status.completed{background:#ECFDF5;color:var(--green)}
.tl-name{font-size:14px;font-weight:600;margin-bottom:2px}
.tl-city{font-size:12px;color:var(--text-light)}
.tl-note{font-size:12px;color:var(--text-light);margin-top:4px;font-style:italic}
.tl-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.tl-act-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--text)}
.tl-act-btn:active{background:var(--bg)}
.tl-act-btn.del{color:var(--red);border-color:#FCA5A5}
.tl-act-btn.done-btn{color:var(--green);border-color:#86EFAC}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-sheet{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.modal-head{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{width:28px;height:28px;border:none;background:var(--bg);border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-light)}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.form-item{margin-bottom:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:4px;display:block}
.form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--red)}
.form-textarea{resize:vertical;min-height:60px}
.type-picker{display:flex;gap:8px}
.type-opt{flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.type-opt.sel-food{border-color:var(--red);background:var(--red-light);color:var(--red)}
.type-opt.sel-scenic{border-color:var(--blue);background:#E8F2FF;color:var(--blue)}
.type-opt.sel-hotel{border-color:var(--orange);background:#FFF7ED;color:var(--orange)}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.modal-foot .submit-btn{width:100%;padding:12px;border:none;background:var(--red);color:#fff;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer}
.modal-foot .submit-btn:active{opacity:.85}

.toast-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none}
.toast-msg{background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.app-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--white);border-radius:16px;padding:24px;width:280px;text-align:center;z-index:150;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.app-dialog h4{font-size:16px;margin-bottom:8px}
.app-dialog p{font-size:13px;color:var(--text-light);margin-bottom:16px}
.app-dialog button{padding:8px 24px;border:none;border-radius:20px;background:var(--red);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.dialog-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:140}

.filter-chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--text)}
.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.chip:active{opacity:.85}
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-pill{flex:1;background:var(--white);border-radius:10px;padding:8px;text-align:center}
.stat-pill .num{font-size:20px;font-weight:800;color:var(--black)}
.stat-pill .label{font-size:10px;color:var(--text-light)}

/* 热门城市入口 */
.hot-cities{margin-top:16px}
.hot-cities-title{font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:8px}
.city-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.city-card{background:var(--white);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;border:1px solid transparent;transition:all .15s}
.city-card:active{transform:scale(.95);border-color:var(--red)}
.city-card .emoji{font-size:22px;margin-bottom:2px}
.city-card .name{font-size:12px;font-weight:600;color:var(--text)}

/* 搜索类型标签 */
.search-type-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stype-tab{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--text)}
.stype-tab.active{background:var(--red);color:#fff;border-color:var(--red)}

/* 时间线进度条 */
.tl-progress-bar{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden}
.tl-progress-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tl-progress-title{font-size:11px;font-weight:600;color:var(--text)}
.tl-progress-summary{font-size:10px;color:var(--text-light)}
.tl-progress-track{position:relative;height:28px;background:var(--white);border-radius:6px;overflow:hidden;margin-bottom:4px}
.tl-progress-block{position:absolute;top:0;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;transition:opacity .2s;cursor:default}
.tl-progress-block.type-food{background:rgba(255,36,66,.15);color:var(--red)}
.tl-progress-block.type-scenic{background:rgba(74,158,245,.15);color:var(--blue)}
.tl-progress-block.type-hotel{background:rgba(255,136,0,.15);color:var(--orange)}
.tl-progress-block.is-done{opacity:1;font-weight:800}
.tl-progress-block.not-done{opacity:.35}
.tl-progress-hours{position:relative;height:16px;font-size:9px;color:var(--text-light);padding:0 2px;margin-top:2px}
.tl-time-range{font-size:11px;color:var(--text-light);margin-left:6px}
.tl-reason{font-size:11px;color:var(--red);margin-top:4px;font-style:italic;padding:4px 8px;background:var(--red-light);border-radius:4px}
.tl-reason::before{content:'未完成原因：';font-weight:600}

@media(min-width:481px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-title">旅途<span>热榜</span></div>
      <div class="header-actions">
        <button class="header-btn" onclick="exportData()" title="导出数据">📤</button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="搜索任意城市或地点（如：成都火锅、杭州景点）" enterkeyhint="search">
      </div>
      <button class="search-btn" id="search-btn" onclick="doSearch()">搜索</button>
    </div>
    <div class="search-hints" id="hot-tags"></div>
  </div>
  <div class="page-container">
    <div class="page active" id="page-search">
      <div id="search-content">
        <div class="hot-cities" id="hot-cities"></div>
      </div>
    </div>
    <div class="page" id="page-timeline">
      <div class="timeline-header"><h2>我的旅行时间线</h2><div style="display:flex;gap:6px"><button class="header-btn" onclick="exportData()" title="导出数据" style="width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px">📤</button><button class="add-manual-btn" onclick="showAddModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>手动添加</button></div></div>
      <div id="timeline-stats" class="stats-row" style="display:none">
        <div class="stat-pill"><div class="num" id="tl-total">0</div><div class="label">总计划</div></div>
        <div class="stat-pill"><div class="num" id="tl-pending">0</div><div class="label">待打卡</div></div>
        <div class="stat-pill"><div class="num" id="tl-done">0</div><div class="label">已打卡</div></div>
      </div>
      <div id="timeline-filter" class="filter-chips" style="display:none">
        <span class="chip active" data-filter="all" onclick="filterTimeline('all',this)">全部</span>

// ============ 核心搜索逻辑 ============
async function doSearch(){
  var q=document.getElementById('search-input').value.trim();
  if(!q){toast('请输入城市或地点名称');return}
  if(isSearching)return;
  isSearching=true;
  var btn=document.getElementById('search-btn');
  btn.disabled=true;btn.textContent='搜索中...';
  
  showLoading(q);
  
  try{
    // 解析搜索意图
    var intent=parseSearchIntent(q);
    currentCity=intent.city;
    
    // 获取内置数据库结果
    var dbResults=getDBResults(intent);
    
    // 尝试实时搜索小红书（限时5秒）
    var xhsResults=null;
    try{
      xhsResults=await Promise.race([
        searchXHS(intent.keyword),
        new Promise(function(res){setTimeout(function(){res(null)},5000)})
      ]);
    }catch(e){xhsResults=null}
    
    // 合并渲染（即使内置数据为空，也渲染小红书实时结果和跳转入口）
    if(dbResults.hasData||xhsResults){
      renderAllResults(intent,xhsResults,dbResults);
    }else{
      renderNoResult(intent);
    }
  }catch(e){
    console.error('搜索出错:',e);
    // 降级到无结果页面（提供APP跳转入口）
    var intent2=parseSearchIntent(q);
    currentCity=intent2.city;
    renderNoResult(intent2);
  }
  
  isSearching=false;
  btn.disabled=false;btn.textContent='搜索';
}

// 解析搜索意图
function parseSearchIntent(q){
  q=q.replace(/市$/,'').trim();
  var city='';var category='';var keyword='';
  
  // 尝试匹配内置城市名
  var cityNames=Object.keys(CITY_DB);
  for(var i=0;i<cityNames.length;i++){
    if(q.indexOf(cityNames[i])===0){
      city=cityNames[i];
      q=q.substring(city.length).trim();
      break;
    }
  }
  
  // 如果没匹配到内置城市，尝试识别其他中国城市名（2-3字+常见后缀）
  if(!city){
    var commonCities='拉萨,丽江,青岛,苏州,无锡,宁波,大连,哈尔滨,昆明,贵阳,海口,珠海,佛山,东莞,温州,绍兴,嘉兴,泉州,漳州,九江,景德镇,威海,烟台,潍坊,洛阳,开封,桂林,北海,张家界,凤凰,敦煌,嘉峪关,西宁,银川,呼和浩特,包头,延吉,丹东,宜宾,泸州,遵义,荆州,宜昌,襄阳,岳阳,衡阳,九江,赣州,龙岩,三明,宁德,莆田,南平,武夷山,都江堰,乐山,峨眉山,九寨沟,康定,香格里拉,腾冲,芒市,西双版纳,普洱,临沧,建水,元阳,镇远,黄果树,荔波,凤凰古城,阳朔,德天瀑布,涠洲岛,嵊泗,千灯,周庄,同里,乌镇,西塘,南浔,甪直,木渎,朱家角';
    var cityList=commonCities.split(',');
    for(var i=0;i<cityList.length;i++){
      if(q.indexOf(cityList[i])===0){
        city=cityList[i];
        q=q.substring(city.length).trim();
        break;
      }
    }
  }
  
  // 如果还是没匹配到，尝试提取开头2-3字作为城市（智能识别）
  if(!city){
    var m2=q.match(/^([\u4e00-\u9fff]{2,3})(?:\s+|$|美食|吃|火锅|小吃|景点|玩|旅游|酒店|住|民宿|打卡|必去|推荐|攻略|网红|隐藏|地道)/);
    if(m2){
      city=m2[1];
      q=q.substring(city.length).trim();
    }
  }
  
  // 匹配分类关键词
  var foodKw=['美食','吃','火锅','小吃','串串','烤肉','奶茶','面','饭','餐厅','馆子','宵夜'];
  var scenicKw=['景点','玩','旅游','公园','古镇','博物馆','寺','山','湖','海','岛','打卡','必去'];
  var hotelKw=['酒店','住','民宿','宾馆','住宿','旅舍'];
  
  for(var i=0;i<foodKw.length;i++){if(q.indexOf(foodKw[i])>=0){category='food';break}}
  if(!category){for(var i=0;i<scenicKw.length;i++){if(q.indexOf(scenicKw[i])>=0){category='scenic';break}}}
  if(!category){for(var i=0;i<hotelKw.length;i++){if(q.indexOf(hotelKw[i])>=0){category='hotel';break}}}
  
  // 去掉分类关键词后作为搜索词
  keyword=q;
  for(var i=0;i<foodKw.concat(scenicKw,hotelKw).length;i++){
    keyword=keyword.replace(foodKw.concat(scenicKw,hotelKw)[i],'').trim();
  }
  if(!keyword)keyword=city||q;
  
  return {city:city,category:category,keyword:city?city+' '+q:q,original:document.getElementById('search-input').value.trim()};
}

// ============ 小红书实时搜索（通过CORS代理抓取） ============
async function searchXHS(keyword){
  // 检查缓存
  if(searchCache[keyword]&&(Date.now()-searchCache[keyword].ts<600000)){
    return searchCache[keyword].data;
  }
  
  var results=await fetchViaProxies(keyword);
  if(results&&results.length>0){
    searchCache[keyword]={data:results,ts:Date.now()};
  }
  return results;
}

async function fetchViaProxies(keyword){
  // 尝试从小红书网页版搜索
  var xhsUrl='https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(keyword)+'&source=web_search_result_notes';
  
  for(var i=0;i<CORS_PROXIES.length;i++){
    try{
      var proxyUrl=CORS_PROXIES[i](xhsUrl);
        var resp=await fetchWithTimeout(proxyUrl,5000);
      if(!resp||!resp.ok)continue;
      var html=await resp.text();
      var parsed=parseXHSHTML(html,keyword);
      if(parsed&&parsed.length>0)return parsed;
    }catch(e){
      console.log('代理'+i+'失败:',e.message);
      continue;
    }
  }
  
  // 所有代理都失败，尝试Bing搜索作为备选
  try{
    var bingUrl='https://www.bing.com/search?q='+encodeURIComponent(keyword+' 小红书 推荐 site:xiaohongshu.com');
    for(var i=0;i<2;i++){
      try{
        var proxyUrl=CORS_PROXIES[i](bingUrl);
      var resp=await fetchWithTimeout(proxyUrl,5000);
        if(!resp||!resp.ok)continue;
        var html=await resp.text();
        var parsed=parseBingHTML(html,keyword);
        if(parsed&&parsed.length>0)return parsed;
      }catch(e){continue}
    }
  }catch(e){}
  
  return null;
}

function fetchWithTimeout(url,ms){
  return Promise.race([
    fetch(url),
    new Promise(function(_,reject){setTimeout(function(){reject(new Error('timeout'))},ms)})
  ]);
}

// 解析小红书搜索结果HTML
function parseXHSHTML(html,keyword){
  var results=[];
  try{
    // 尝试从JSON-LD或script标签提取数据
    var scriptMatch=html.match(/window\.__INITIAL_STATE__\s*=\s*({.+?})\s*<\/script>/);
    if(scriptMatch){
      try{
        var jsonStr=scriptMatch[1].replace(/undefined/g,'null');
        var data=JSON.parse(jsonStr);
        if(data&&data.search&&data.search.notes){
          var notes=data.search.notes;
          for(var i=0;i<Math.min(notes.length,10);i++){
            var n=notes[i];
            results.push({
              title:n.title||n.note_card&&n.note_card.title||'',
              desc:n.note_card&&n.note_card.desc||'',
              author:n.user&&n.user.nickname||'',
              likes:n.note_card&&n.note_card.interactInfo&&n.note_card.interactInfo.likedCount||'',
              type:'xhs',
              keyword:keyword
            });
          }
        }
      }catch(e){console.log('解析小红书JSON失败',e)}
    }
    
    // 如果JSON解析失败，尝试从HTML提取
    if(results.length===0){
      var noteRegex=/class="note-item"[^>]*>[\s\S]*?<a[^>]*title="([^"]*)"[^>]*>/g;
      var match;
      while((match=noteRegex.exec(html))!==null&&results.length<10){
        results.push({title:match[1],desc:'',author:'',likes:'',type:'xhs',keyword:keyword});
      }
    }
    
    // 再尝试另一种模式
    if(results.length===0){
      var sections=html.split(/<section[^>]*class="note-item/);
      for(var i=1;i<sections.length&&i<=10;i++){
        var titleMatch=sections[i].match(/title="([^"]*)"/);
        if(titleMatch){
          var authorMatch=sections[i].match(/class="name"[^>]*>([^<]*)</);
          var likeMatch=sections[i].match(/class="like-wrapper[^"]*"[^>]*>[\s\S]*?(\d[\d万+]*)\s*<\/span>/);
          results.push({
            title:titleMatch[1],
            desc:'',
            author:authorMatch?authorMatch[1].trim():'',
            likes:likeMatch?likeMatch[1]:'',
            type:'xhs',
            keyword:keyword
          });
        }
      }
    }
  }catch(e){console.log('解析XHS HTML失败',e)}
  return results;
}

// 解析Bing搜索结果HTML
function parseBingHTML(html,keyword){
  var results=[];
  try{
    // 提取Bing搜索结果中的小红书链接
    var liRegex=/<li class="b_algo">[\s\S]*?<a href="([^"]*xiaohongshu[^"]*)"[^>]*>([\s\S]*?)<\/a>[\s\S]*?<p[^>]*>([\s\S]*?)<\/p>/g;
    var match;
    while((match=liRegex.exec(html))!==null&&results.length<10){
      var title=match[2].replace(/<[^>]*>/g,'').trim();
      var desc=match[3].replace(/<[^>]*>/g,'').trim().substring(0,80);
      results.push({title:title,desc:desc,url:match[1],author:'',likes:'',type:'bing',keyword:keyword});
    }
    
    // 备选模式
    if(results.length===0){
      var linkRegex=/<cite[^>]*>([\s\S]*?)<\/cite>/g;
      var titles=html.match(/<h2><a[^>]*>([\s\S]*?)<\/a><\/h2>/g);
      if(titles){
        for(var i=0;i<Math.min(titles.length,10);i++){
          var t=titles[i].replace(/<[^>]*>/g,'').trim();
          if(t)results.push({title:t,desc:'',author:'',likes:'',type:'bing',keyword:keyword});
        }
      }
    }
  }catch(e){}
  return results;
}

// 获取内置数据库结果
function getDBResults(intent){
  var city=intent.city;
  var cat=intent.category;
  var result={hasData:false,food:[],scenic:[],hotel:[]};
  
  if(city&&CITY_DB[city]){
    result.food=CITY_DB[city].food||[];
    result.scenic=CITY_DB[city].scenic||[];
    result.hotel=CITY_DB[city].hotel||[];
    if(result.food.length||result.scenic.length||result.hotel.length)result.hasData=true;
  }
  
  // 如果指定了分类，只返回对应分类
  if(cat&&result.hasData){
    if(cat==='food'){result.scenic=[];result.hotel=[]}
    else if(cat==='scenic'){result.food=[];result.hotel=[]}
    else if(cat==='hotel'){result.food=[];result.scenic=[]}
  }
  
  return result;
}

// 根据日期自动推算下一个行程的起始时间
function getNextStartTime(date){
  if(!date)return '';
  var dayItems=timelineData.filter(function(t){return t.date===date&&t.endTime});
  if(dayItems.length===0)return '';
  // 找到该日期最大的结束时间
  var maxEnd=0;
  for(var i=0;i<dayItems.length;i++){
    var e=parseInt(dayItems[i].endTime);
    if(!isNaN(e)&&e>maxEnd)maxEnd=e;
  }
  return maxEnd>0?String(maxEnd):'';
}

function addToTimeline(city,name,type){
  // 防止重复添加
  var exists=timelineData.some(function(t){return t.name===name&&t.city===city});
  if(exists){toast('已在打卡计划中');return}
  var today=new Date().toISOString().slice(0,10);
  var autoStart=getNextStartTime(today);
  var rec={id:Date.now()+Math.floor(Math.random()*10000),city:city,name:name,type:type,date:today,note:'',reason:'',startTime:autoStart,endTime:'',status:'pending',createdAt:new Date().toISOString()};
  timelineData.push(rec);saveTimeline();renderTimeline();toast(autoStart?'已加入，自动接续'+autoStart+'时':'已加入打卡计划');
}

function renderTimeline(){
  // 渲染前记住当前日期分组的折叠状态
  if(!window._tlCollapsedDates)window._tlCollapsedDates={};
  var oldGroups=document.querySelectorAll('.date-group');
  for(var gi=0;gi<oldGroups.length;gi++){var gk=oldGroups[gi].getAttribute('data-date');var gbody=oldGroups[gi].querySelector('.date-group-body');if(gbody&&gbody.classList.contains('collapsed')){window._tlCollapsedDates[gk]=true}else{delete window._tlCollapsedDates[gk]}}

  var sorted=timelineData.slice().sort(function(a,b){return(a.date||'').localeCompare(b.date||'')});
  if(tlFilter==='food')sorted=sorted.filter(function(r){return r.type==='food'});
  else if(tlFilter==='scenic')sorted=sorted.filter(function(r){return r.type==='scenic'});
  else if(tlFilter==='hotel')sorted=sorted.filter(function(r){return r.type==='hotel'});
  else if(tlFilter==='pending')sorted=sorted.filter(function(r){return r.status==='pending'});
  else if(tlFilter==='done')sorted=sorted.filter(function(r){return r.status==='done'});
  var statsEl=document.getElementById('timeline-stats');var filterEl=document.getElementById('timeline-filter');
  if(timelineData.length>0){
    statsEl.style.display='flex';filterEl.style.display='flex';
    document.getElementById('tl-total').textContent=timelineData.length;
    document.getElementById('tl-pending').textContent=timelineData.filter(function(r){return r.status==='pending'}).length;
    document.getElementById('tl-done').textContent=timelineData.filter(function(r){return r.status==='done'}).length;
  }else{statsEl.style.display='none';filterEl.style.display='none'}
  if(!sorted.length){document.getElementById('timeline-content').innerHTML='<div class="empty-state"><div class="icon">📅</div><p>'+(timelineData.length?'当前筛选无结果':'还没有旅行打卡计划')+'</p></div>';return}

  // 按日期分组
  var groups={};for(var i=0;i<sorted.length;i++){var d=sorted[i].date||'未定日期';if(!groups[d])groups[d]=[];groups[d].push(sorted[i])}
  var allDates=Object.keys(groups).sort(function(a,b){return a.localeCompare(b)});

  // 近8天：从今天往后推8天（今天+未来8天）
  var today=new Date();var todayStr=today.toISOString().slice(0,10);var recent8=[];
  for(var i=0;i<8;i++){var t=new Date(today);t.setDate(t.getDate()+i);recent8.push(t.toISOString().slice(0,10))}

  // 是否处于搜索模式
  var searchKw=(window._tlSearchKw||'').trim();
  var searchDate=(window._tlSearchDate||'').trim();
  var html='';

  // 顶部搜索栏：文本搜索地点名/城市名 + 日期搜索
  html+='<div class="tl-date-search">';
  html+='<input id="tl-search-input" placeholder="搜索地点或城市名" value="'+esc(searchKw)+'">';
  if(searchDate){
    html+='<button class="tl-date-search-btn active" onclick="clearTimelineDateSearch()"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>'+esc(searchDate)+'<span class=\"date-clear\">&times;</span></button>';
  }else{
    html+='<div class="tl-date-wrap"><span class="date-placeholder"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>按日期搜</span><input id="tl-date-picker" type="date" class="tl-date-input" onchange="doTimelineDateSearch(this.value);if(this.value)this.previousElementSibling.style.display=\'none\';else this.previousElementSibling.style.display=\'\'" style="color:transparent"></div>';
  }
  html+='</div>';

  var displayDates=[];
  if(searchKw){
    // 地点名/城市名搜索：覆盖显示
    for(var i=0;i<allDates.length;i++){
      var dk=allDates[i];var items=groups[dk];
      var nameMatch=false;for(var j=0;j<items.length;j++){if(items[j].name.indexOf(searchKw)>=0||items[j].city.indexOf(searchKw)>=0){nameMatch=true;break}}
      if(nameMatch)displayDates.push(dk);
    }
    html+='<div class="tl-search-result-tag">搜索"'+esc(searchKw)+'" · '+displayDates.length+'天 <button onclick="clearTimelineSearch()">&times;</button></div>';
  }else if(searchDate){
    // 日期搜索：覆盖显示
    if(groups[searchDate])displayDates=[searchDate];
    html+='<div class="tl-search-result-tag">'+esc(searchDate)+' · '+(displayDates.length?'1天':'0条')+' <button onclick="clearTimelineSearch()">&times;</button></div>';
  }else{
    // 默认模式：只显示近8天（今天往后）
    for(var i=0;i<allDates.length;i++){
      if(allDates[i]==='未定日期'||recent8.indexOf(allDates[i])>=0){
        displayDates.push(allDates[i]);
      }
    }
  }

  // 渲染日期分组
  if(!displayDates.length){
    html+='<div class="empty-state"><div class="icon">🔍</div><p>'+(searchKw||searchDate?'没有匹配的结果':'近8天没有打卡记录')+'</p></div>';
  }
  for(var di=0;di<displayDates.length;di++){
    var dateKey=displayDates[di];var items=groups[dateKey];
    var isToday=dateKey===todayStr;
    var isTomorrow='';
    if(!isToday&&dateKey!=='未定日期'){var tm=new Date(today);tm.setDate(tm.getDate()+1);if(dateKey===tm.toISOString().slice(0,10))isTomorrow=' (明天)'}
    var dateName=dateKey==='未定日期'?'未定日期':dateKey+(isToday?' (今天)':isTomorrow);
    var doneCount=items.filter(function(r){return r.status==='done'}).length;
    var isCollapsed=window._tlCollapsedDates[dateKey];
    html+='<div class="date-group" data-date="'+esc(dateKey)+'">';
    html+='<div class="date-label" onclick="toggleDateGroup(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+esc(dateName)+'<span style="margin-left:4px;font-size:11px;font-weight:400;color:var(--text-light)">'+doneCount+'/'+items.length+'</span><span class="toggle-icon'+(isCollapsed?' collapsed':'')+'">▼</span></div>';
    html+='<div class="date-group-body'+(isCollapsed?' collapsed':'')+'"'+(isCollapsed?' style="max-height:0;overflow:hidden"':'')+'>';
    html+=renderDayProgress(items);
    for(var j=0;j<items.length;j++){
      var r=items[j];var typeLabel=r.type==='food'?'吃':r.type==='scenic'?'玩':'住';var typeEmoji=r.type==='food'?'🍜':r.type==='scenic'?'🎡':'🏨';var isDone=r.status==='done';
      html+='<div class="tl-card type-'+r.type+(isDone?' done':'')+'"><div class="tl-top"><span class="tl-type type-'+r.type+'">'+typeEmoji+' '+typeLabel+'</span><button class="tl-status '+(isDone?'completed':'pending')+'" onclick="toggleStatus('+r.id+')">'+(isDone?'已打卡':'待打卡')+'</button></div>';
      html+='<div class="tl-name">'+esc(r.name)+'</div><div class="tl-city">📍 '+esc(r.city)+'</div>';
      if(r.startTime||r.endTime)html+='<div class="tl-time-range">🕐 '+(r.startTime||'?')+'-'+(r.endTime||'?')+'时</div>';
      if(r.note)html+='<div class="tl-note">💬 '+esc(r.note)+'</div>';
      if(!isDone&&r.reason)html+='<div class="tl-reason">'+esc(r.reason)+'</div>';
      html+='<div class="tl-actions"><button class="tl-act-btn done-btn" onclick="toggleStatus('+r.id+')">'+(isDone?'取消完成':'完成打卡')+'</button><button class="tl-act-btn" onclick="editRecord('+r.id+')">编辑</button><button class="tl-act-btn del" onclick="deleteRecord('+r.id+')">删除</button></div></div>';
    }
    html+='</div></div>';
  }

  document.getElementById('timeline-content').innerHTML=html;
  // 搜索框回车
  var searchInput=document.getElementById('tl-search-input');
  if(searchInput){searchInput.addEventListener('keydown',function(e){if(e.key==='Enter')doTimelineSearch()})}
  // 日期input有值时显示日期文本
  var dpEl=document.getElementById('tl-date-picker');
  if(dpEl&&dpEl.value){dpEl.style.color='';var ph=dpEl.previousElementSibling;if(ph)ph.style.display='none'}
}

// 时间线文本搜索
function doTimelineSearch(){
  var val=document.getElementById('tl-search-input').value.trim();
  window._tlSearchKw=val;window._tlSearchDate='';
  renderTimeline();
}
// 时间线日期搜索
function doTimelineDateSearch(val){
  if(val){window._tlSearchDate=val;window._tlSearchKw=''}
  else{window._tlSearchDate=''}
  renderTimeline();
}
function clearTimelineSearch(){
  window._tlSearchKw='';window._tlSearchDate='';
  renderTimeline();
}
function clearTimelineDateSearch(){
  window._tlSearchDate='';
  renderTimeline();
}
function triggerDatePick(){
  var dp=document.getElementById('tl-date-picker');if(dp){dp.value='';if(dp.showPicker)dp.showPicker();else dp.focus(),dp.click();}
}

// 日期分组收起/展开
function toggleDateGroup(labelEl){
  var body=labelEl.nextElementSibling;
  var icon=labelEl.querySelector('.toggle-icon');
  if(body.classList.contains('collapsed')){
    body.classList.remove('collapsed');
    body.style.maxHeight=body.scrollHeight+'px';
    icon.classList.remove('collapsed');
  }else{
    body.style.maxHeight=body.scrollHeight+'px';
    requestAnimationFrame(function(){body.classList.add('collapsed');icon.classList.add('collapsed')});
  }
}

// 渲染按日期汇总进度条
function renderDayProgress(items){
  var done=0;var total=items.length;
  for(var i=0;i<items.length;i++){if(items[i].status==='done')done++}
  var pct=total>0?Math.round(done/total*100):0;
  // 找出时间范围（用于进度条横轴）
  var minH=24;var maxH=0;var hasTime=false;
  for(var i=0;i<items.length;i++){
    var s=parseInt(items[i].startTime);var e=parseInt(items[i].endTime);
    if(!isNaN(s)&&!isNaN(e)){hasTime=true;if(s<minH)minH=s;if(e>maxH)maxH=e}
  }
  if(!hasTime){minH=6;maxH=23}
  // 扩展范围到整点，前后各留1小时余量
  minH=Math.max(0,minH-1);maxH=Math.min(23,maxH+1);
  if(minH>=maxH){minH=6;maxH=23}
  var range=maxH-minH;var trackWidth=100;
  var html='<div class="tl-progress-bar">';
  html+='<div class="tl-progress-header"><span class="tl-progress-title">当日进度</span><span class="tl-progress-summary">'+done+'/'+total+' 已完成 ('+pct+'%)</span></div>';
  // 进度条轨道
  html+='<div class="tl-progress-track">';
  for(var i=0;i<items.length;i++){
    var r=items[i];var s=parseInt(r.startTime);var e=parseInt(r.endTime);
    var leftPct=0;var widthPct=0;
    if(!isNaN(s)&&!isNaN(e)){
      leftPct=((s-minH)/range)*trackWidth;
      widthPct=((e-s)/range)*trackWidth;
    }else{
      // 没有时间的项目，均分宽度
      var idx=i;var perItem=trackWidth/items.length;
      leftPct=idx*perItem;widthPct=perItem;
    }
    if(widthPct<5)widthPct=5;
    if(leftPct+widthPct>100)widthPct=100-leftPct;
    var isDone=r.status==='done';
    var typeCls=r.type==='food'?'type-food':r.type==='scenic'?'type-scenic':'type-hotel';
    var doneCls=isDone?'is-done':'not-done';
    var shortName=r.name.length>4?r.name.substring(0,4)+'…':r.name;
    html+='<div class="tl-progress-block '+typeCls+' '+doneCls+'" style="left:'+leftPct.toFixed(1)+'%;width:'+widthPct.toFixed(1)+'%" title="'+esc(r.name)+' ('+(r.startTime||'?')+'-'+(r.endTime||'?')+'时)">'+esc(shortName)+'</div>';
  }
  html+='</div>';
  // 时间刻度：每隔2小时标注，最多显示6个刻度
  html+='<div class="tl-progress-hours">';
  var step=range<=8?1:range<=16?2:3;
  for(var h=minH;h<=maxH;h+=step){
    var pos=((h-minH)/range)*100;
    html+='<span style="position:absolute;left:'+pos.toFixed(1)+'%;transform:translateX(-50%)">'+h+':00</span>';
  }
  html+='</div>';
  html+='</div>';
  return html;
}
function toggleStatus(id){for(var i=0;i<timelineData.length;i++){if(timelineData[i].id===id){timelineData[i].status=timelineData[i].status==='done'?'pending':'done';break}}saveTimeline();renderTimeline();toast('状态已更新')}
function deleteRecord(id){if(!confirm('确定删除此打卡计划？'))return;timelineData=timelineData.filter(function(r){return r.id!==id});saveTimeline();renderTimeline();toast('已删除')}
function editRecord(id){
  var r=timelineData.find(function(r){return r.id===id});if(!r)return;
  document.getElementById('e-id').value=id;document.getElementById('e-city').value=r.city;document.getElementById('e-name').value=r.name;document.getElementById('e-date').value=r.date||'';document.getElementById('e-note').value=r.note||'';
  document.getElementById('e-start').value=r.startTime||'';document.getElementById('e-end').value=r.endTime||'';document.getElementById('e-reason').value=r.reason||'';
  openModal('modal-edit');
}
function saveEdit(){
  var id=parseInt(document.getElementById('e-id').value);
  for(var i=0;i<timelineData.length;i++){if(timelineData[i].id===id){timelineData[i].city=document.getElementById('e-city').value.trim()||timelineData[i].city;timelineData[i].name=document.getElementById('e-name').value.trim()||timelineData[i].name;timelineData[i].date=document.getElementById('e-date').value||timelineData[i].date;timelineData[i].note=document.getElementById('e-note').value.trim();timelineData[i].startTime=document.getElementById('e-start').value.trim();timelineData[i].endTime=document.getElementById('e-end').value.trim();timelineData[i].reason=document.getElementById('e-reason').value.trim();break}}
  saveTimeline();renderTimeline();closeModal('modal-edit');toast('已更新');
}
function filterTimeline(f,el){tlFilter=f;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});if(el)el.classList.add('active');renderTimeline()}
function exportData(){
  if(!timelineData.length){toast('暂无数据可导出');return}
  var bom='\uFEFF';var csv=bom+'城市,地点名称,类型,计划日期,开始时间,结束时间,备注,未完成原因,状态\n';var typeMap={food:'美食',scenic:'景点',hotel:'酒店'};
  for(var i=0;i<timelineData.length;i++){var r=timelineData[i];csv+='"'+(r.city||'').replace(/"/g,'""')+'","'+(r.name||'').replace(/"/g,'""')+'",'+(typeMap[r.type]||r.type)+','+(r.date||'')+', '+(r.startTime||'')+', '+(r.endTime||'')+',"'+(r.note||'').replace(/"/g,'""')+'","'+(r.reason||'').replace(/"/g,'""')+'",'+(r.status==='done'?'已打卡':'待打卡')+'\n'}
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='旅行打卡_'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('导出成功');
}
function switchTab(tab,btn){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById('page-'+tab).classList.add('active');document.querySelectorAll('.tab-item').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');var header=document.querySelector('.header');if(tab==='timeline'){header.style.display='none'}else{header.style.display=''}}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escAttr(s){return s?s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function toast(msg){var wrap=document.getElementById('toast-wrap');wrap.innerHTML='<div class="toast-msg">'+esc(msg)+'</div>';setTimeout(function(){wrap.innerHTML=''},2000)}
init();
</script>
